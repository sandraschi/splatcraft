[workspace]
members = [
    "crates/splat-formats",
    "crates/splatcraft-core",
    "crates/splatcraft-mcp",
    "crates/splatcraft-app",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sandraschi/splatcraft"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
todo = "deny"

[workspace.dependencies]
serde_json = "1.0"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
tempfile = "3"
