[project]
name = "splatcraft"
version = "0.1.0"
description = "3D Gaussian Splat & Radiance Field manipulation CLI and MCP server"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Sandra Schipal" }]
dependencies = [
    "fastmcp>=3.0.0",
    "typer>=0.12.0",
    "pydantic>=2.6.0",
    "rich>=13.7.0",
    "numpy>=1.26.0",
    "plyfile>=1.0.0",
]

[project.scripts]
splatcraft = "splatcraft.cli:app"
splatcraft-cli = "splatcraft.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.8.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
